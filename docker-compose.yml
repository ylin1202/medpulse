version: '3.8'

services:
  # Distributed Cache (Redis)
  redis:
    image: redis:7-alpine
    container_name: medpulse-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - medpulse-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Backend API (Flask)
  flask-api:
    image: medpulse-flask-api:latest
    build:
      context: ./medpulse-flask
      dockerfile: Dockerfile
    container_name: medpulse-flask
    restart: unless-stopped
    ports:
      - "${FLASK_PORT:-5001}:5001"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - ./medpulse-flask/.env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - medpulse-network

  # AI Inference & Retrieval Service (FastAPI + LangGraph)
  ai-service:
    image: medpulse-ai-service:latest
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: medpulse-ai-service
    restart: unless-stopped
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - ./ai-service/.env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./ai-service/model:/app/model
    networks:
      - medpulse-network

volumes:
  redis_data:
    driver: local

networks:
  medpulse-network:
    driver: bridge